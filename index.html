<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Defaults — will be overwritten per route by scripts/postbuild.mjs at build time. -->
    <title>Luxury Event Stylist Surrey | River Fox Events</title>
    <meta name="description" content="Surrey event stylist for children's parties, milestone celebrations and corporate brand activations across Surrey and London. From £460, designed by Laura." />
    <meta name="author" content="River Fox Events" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="River Fox Events" />
    <meta property="og:title" content="Luxury Event Styling Surrey | River Fox Events" />
    <meta property="og:description" content="Surrey event stylist for children's parties, milestone celebrations and corporate brand activations across Surrey and London. From £460, designed by Laura." />
    <meta property="og:image" content="/social-share.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luxury Event Styling Surrey | River Fox Events" />
    <meta name="twitter:description" content="Surrey event stylist for children's parties, milestone celebrations and corporate brand activations across Surrey and London. From £460, designed by Laura." />
    <meta name="twitter:image" content="/social-share.jpg" />

    <link rel="icon" href="/favicon.ico" />

    <!-- Google tag (gtag.js) with Consent Mode v2.
         Defaults to "denied" so no analytics cookies fire until the visitor
         accepts via the cookie banner. If a previous choice is saved in
         localStorage, we apply it before gtag('config') runs so accepted
         users are tracked from page 1. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L2YVNSW0ZQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      try {
        if (localStorage.getItem('rfx-consent') === 'granted') {
          gtag('consent', 'update', {
            analytics_storage: 'granted',
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
      } catch (e) {}
      gtag('js', new Date());
      gtag('config', 'G-L2YVNSW0ZQ');
      gtag('config', 'AW-18210626936');
    </script>

    <!-- Preference panel: review-only pill (see public/pref-panel.js). On for
         localhost and Netlify previews, or anywhere with ?panel. Skipped under
         automation (navigator.webdriver) so the prerender step never bakes it
         into the static HTML. Visitors never download it. -->
    <script>
      (function(){
        var on=false,q=new URLSearchParams(location.search).get("panel");
        try{
          if(q==="off")localStorage.removeItem("pref-panel:on");
          else if(q!==null)localStorage.setItem("pref-panel:on","1");
          on=localStorage.getItem("pref-panel:on")==="1";
        }catch(e){}
        var h=location.hostname;
        on=on||/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+)$/.test(h)||/\.netlify\.app$/.test(h);
        if(!on||q==="off")return;
        if(navigator.webdriver&&q===null)return;
        window.PREF_PANEL={
          groups:[
            {id:"xmas",label:"Christmas edition",options:[
              {value:"frost",title:"Frost & gold",sub:"Stays on cream, antique gold accents"},
              {value:"spruce",title:"Spruce & berry",sub:"Deep spruce sections, berry buttons, gold italics"},
              {value:"brand",title:"Everyday brand",sub:"No Christmas changes, for comparison"}
            ]}
          ]
        };
        try{
          var s=JSON.parse(localStorage.getItem("pref-panel"))||{},p=s.prefs||{};
          window.PREF_PANEL.groups.forEach(function(g){
            document.documentElement.setAttribute("data-pref-"+g.id,p[g.id]||g.options[0].value);
          });
        }catch(e){}
        var el=document.createElement("script");
        el.src="/pref-panel.js";el.defer=true;
        document.head.appendChild(el);
      })();
    </script>
  </head>

  <body>
    <!--
      Static form for Netlify's build-time form detection. The real form is
      rendered by React (src/components/rfx/Enquire.tsx) and POSTs to "/" with
      these same field names. Netlify needs to see this in the static HTML to
      register the form and route submissions to Forms → Notifications.
    -->
    <form name="enquire" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="date" />
      <input type="text" name="type" />
      <input type="text" name="venue" />
      <input type="text" name="budget" />
      <input type="text" name="referral" />
      <textarea name="vision"></textarea>
      <input type="text" name="page" />
      <input type="text" name="bot-field" />
    </form>

    <!-- Static form for the /contact page enquiry form. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="date" />
      <input type="text" name="type" />
      <input type="text" name="venue" />
      <input type="text" name="budget" />
      <input type="text" name="referral" />
      <textarea name="vision"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!-- Static form for the /christmas-door-garlands booking form. Multipart
         because it carries a photo of the door. -->
    <form name="christmas-doorway" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="postcode" />
      <input type="text" name="property" />
      <input type="text" name="garland" />
      <input type="text" name="measurements" />
      <input type="text" name="install" />
      <input type="file" name="door-photo" />
      <input type="text" name="takedown" />
      <textarea name="notes"></textarea>
      <input type="text" name="page" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
