<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>How Laura's posts get made</title>
<style>
@font-face { font-family: Fraunces; font-weight: 400; src: url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Fraunces; font-weight: 400; font-style: italic; src: url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "DM Mono"; font-weight: 500; src: url(node_modules/@fontsource/dm-mono/files/dm-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 500; src: url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2) format("woff2"); }
/* Laura's website colours (src/index.css) */
:root { --cream: hsl(47 22% 92%); --light: hsl(45 36% 98%); --warm: hsl(14 42% 93%); --ink: hsl(100 8% 10%); --neutral: hsl(100 5% 29%); --pink: hsl(12 55% 78%); --accent-dark: hsl(12 32% 54%); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); color: var(--ink); }
.brand { position: absolute; top: 56px; left: 80px; font: 500 20px "DM Mono", monospace; letter-spacing: .16em; color: var(--neutral); }
svg#svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.title { position: absolute; left: 0; right: 0; top: 888px; text-align: center; opacity: 0; font: 400 84px/1.05 Fraunces, serif; letter-spacing: -.012em; }
.title em { color: var(--accent-dark); }
.title .wd { display: inline-block; }
#amb * { stroke-width: 3; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#bar { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--pink); width: 0; }
svg * { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg text { stroke: none; fill: var(--ink); }
svg tspan { stroke: none; fill: inherit; }
.w { fill: var(--light); } .pk { fill: var(--pink); } .wm { fill: var(--warm); } .cr { fill: var(--cream); } .ik { fill: var(--ink); }
.sh { fill: var(--ink); stroke: none; opacity: .09; }
.hl { stroke: var(--light); stroke-width: 5; } .hl.d { stroke: var(--ink); opacity: .25; stroke-width: 3; }
.thin { stroke-width: 3; } .ns { stroke: none; } .faint { opacity: .3; }
.dash { stroke-dasharray: 2 16; stroke-width: 5; opacity: .5; }
.dull { fill: var(--ink); stroke: none; opacity: .3; }
.ac { stroke: var(--accent-dark); stroke-width: 6; }
.onk { stroke: var(--cream); }
text.lab { font: 500 22px "DM Mono", monospace; letter-spacing: .18em; fill: var(--neutral); }
text.num { font: 500 30px "DM Sans", sans-serif; }
text.chip { font: 500 30px "DM Sans", sans-serif; } text.onink { fill: var(--cream); }
text.serif { font: 400 40px Fraunces, serif; } text.serif.s { font-size: 30px; } text.serif.l { font-size: 120px; letter-spacing: -.012em; }
text.it, tspan.it { font-style: italic; fill: var(--accent-dark); }
text.term { font: 500 56px "DM Mono", monospace; fill: var(--cream); } tspan.tp { fill: var(--pink); }
text.mono { font: 500 34px "DM Mono", monospace; fill: var(--accent-dark); }
text.rev { font: 500 34px "DM Sans", sans-serif; } text.glyph { font: 400 110px Fraunces, serif; }
text.cap { font: 500 26px "DM Sans", sans-serif; fill: var(--neutral); } text.cap tspan { opacity: .3; }
text.capbig { font: 400 60px Fraunces, serif; }

/* Scene animations: --d is the delay in seconds from the start of the scene */
.d { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s cubic-bezier(.6,0,.2,1) var(--d,0s) both, show .01s linear var(--d,0s) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.2,1.5,.4,1) var(--d,0s) both; }
.fade { animation: show .45s ease var(--d,0s) both; }
.up { animation: up .6s cubic-bezier(.2,.9,.3,1) var(--d,0s) both; }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear 0s infinite; }
.bob { animation: bob 3s ease-in-out 0s infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
@keyframes hide { from { opacity: 1; } to { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-10px); } }
@keyframes wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes handle { from { transform: translateX(0); } to { transform: translateX(440px); } }
@keyframes fallL { to { transform: translate(-120px, 900px) rotate(-40deg); opacity: 0; } }
@keyframes fallR { to { transform: translate(120px, 900px) rotate(40deg); opacity: 0; } }
@keyframes grow { to { transform: scale(1.14); } }
@keyframes shiftR { to { transform: translateX(194px); } }
@keyframes toFront { 0% { transform: none; } 45% { transform: translate(-330px,-130px) rotate(-8deg); } 100% { transform: translateX(-776px); } }
@keyframes say { to { opacity: 1; fill: var(--ink); } }
@keyframes word { 0% { opacity: 0; transform: translateY(18px); } 30%, 99% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes wordstay { 0% { opacity: 0; transform: translateY(18px); } 30%, 100% { opacity: 1; transform: none; } }
@keyframes curs { to { transform: translateX(336px); } }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes stretch { 0% { opacity: 0; } 1%, 93% { opacity: 1; } 94%, 100% { opacity: 0; } }
@keyframes dropOut { to { transform: translateY(260px); opacity: 0; } }
@keyframes moveX { to { transform: translateX(var(--tx)); } }
@keyframes hookMove { 45% { transform: translate(calc(var(--tx) * .5), -170px) rotate(-6deg); } 100% { transform: translateX(var(--tx)); } }
@keyframes sweep { to { transform: translateX(1168px); } }
@keyframes dimto { to { opacity: .25; } }
.tw { transform-box: fill-box; transform-origin: center; animation: tw 2.4s ease-in-out 0s infinite; }
.eq { transform-box: fill-box; transform-origin: center; animation: eq .6s ease-in-out 0s infinite alternate; }
@keyframes tw { 50% { transform: scale(1.22) rotate(24deg); } }
@keyframes eq { to { transform: scaleY(.3); } }
@keyframes rowDown { to { transform: translateY(104px); } }
@keyframes rowIn { from { opacity: 0; transform: translateY(-100px); } to { opacity: 1; transform: none; } }
@keyframes inflate { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes burst { 0% { opacity: 0; transform: translate(0,0) scale(.3); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); } }
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(-1500px); } }
</style>
</head>
<body>
<div class="brand">RIVER FOX EVENTS</div>
<svg viewBox="0 0 1920 1080" id="svg"></svg>
<div id="titles"></div>
<div id="flash"></div>
<div id="bar"></div>
<script src="out/film/timeline.js"></script>
<script>
const cl = (x) => Math.max(0, Math.min(1, x));
const P = (t, s, d) => cl((t - s) / d);
const outCubic = (x) => 1 - (1 - x) ** 3, inCubic = (x) => x ** 3;
const inOut = (x) => (x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const outBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
const mix = (a, b, k) => a + (b - a) * k;
const bump = (x) => Math.sin(Math.PI * cl(x));
const $ = (id) => document.getElementById(id);
const tf = (el, x, y, sx = 1, sy = sx, r = 0) => el.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${sx} ${sy})`);

// ---------- drawing helpers ----------
const miniArch = (cx, by, r, n = 7) => Array.from({ length: n }, (_, i) => { const a = Math.PI - i / (n - 1) * Math.PI;
  return `<circle class="thin ${["pk", "w", "wm"][i % 3]}" cx="${cx + Math.cos(a) * r}" cy="${by - Math.sin(a) * r}" r="${r * .27}"/>`; }).join("") + `<path class="thin" d="M${cx - r * 1.3} ${by} h${r * 2.6}"/>`;
const box = (x, y, w, h, rx, cls = "w", extra = "") => `<rect class="sh" x="${x + 10}" y="${y + 12}" width="${w}" height="${h}" rx="${rx}"/><rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ${extra}/>`;
const photo = (x, y, w, h, tint = "wm") => box(x, y, w, h, 14) + `<rect class="thin ${tint}" x="${x + 16}" y="${y + 16}" width="${w - 32}" height="${h - 32}" rx="8"/>` + miniArch(x + w / 2, y + h * .68, Math.min(w, h) * .24);
const phone = (x, y, w, h) => box(x, y, w, h, 40) + `<rect class="wm thin" x="${x + 16}" y="${y + 34}" width="${w - 32}" height="${h - 68}" rx="18"/><rect class="ik ns" x="${x + w / 2 - 26}" y="${y + 12}" width="52" height="10" rx="5"/>`;
const star = (x, y, s = 1, cls = "pk", d = 0) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="tw" style="animation-delay:-${((x % 7) / 3).toFixed(2)}s"><path class="pop thin ${cls}" style="--d:${d}s" d="M0 -26 l7 19 l19 7 l-19 7 l-7 19 l-7 -19 l-19 -7 l19 -7 z"/></g></g>`;
const pill = (cx, cy, w, text, cls = "w", d = 0) => `<g class="pop" style="--d:${d}s"><rect class="sh" x="${cx - w / 2 + 6}" y="${cy - 26}" width="${w}" height="64" rx="32"/><rect class="${cls}" x="${cx - w / 2}" y="${cy - 32}" width="${w}" height="64" rx="32"/><text class="chip ${cls === "ik" ? "onink" : ""}" x="${cx}" y="${cy + 10}" text-anchor="middle">${text}</text></g>`;
// A cog with evenly spaced teeth: n teeth, outer radius ro, inner radius ri.
const gear = (cx, cy, n, ro, ri) => { const step = Math.PI * 2 / n, pt = (r, a) => `${(cx + Math.cos(a) * r).toFixed(1)} ${(cy + Math.sin(a) * r).toFixed(1)}`;
  let d = ""; for (let i = 0; i < n; i++) { const a = i * step; d += `${i ? "A" + ri + " " + ri + " 0 0 1 " : "M"}${pt(ri, a - step * .3)} L${pt(ro, a - step * .17)} A${ro} ${ro} 0 0 1 ${pt(ro, a + step * .17)} L${pt(ri, a + step * .3)} `; }
  return `<path class="w" d="${d}A${ri} ${ri} 0 0 1 ${pt(ri, -step * .3)} z"/>`; };
const confetti = (cx, cy, n, d, late = false) => Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2 + (i % 3) * .3, dist = 260 + (i * 53 % 240);
  const st = `--x:${Math.cos(a) * dist}px;--y:${Math.sin(a) * dist * .8 - 60}px;--r:${(i * 97 % 360)}deg;animation:burst 1.3s cubic-bezier(.1,.7,.3,1) ${d}s both`;
  const sh = i % 3 === 0 ? `<circle class="pk thin" cx="${cx}" cy="${cy}" r="10"/>` : i % 3 === 1 ? `<rect class="w thin" x="${cx - 12}" y="${cy - 7}" width="24" height="14" rx="3"/>` : `<path class="thin" d="M${cx} ${cy} q12 -12 0 -24 q-12 -12 0 -24"/>`;
  return `<g style="${st}" ${late ? `data-late="${d}"` : ""}>${sh}</g>`; }).join("");

// ---------- scene 0: photos, folder, Google Drive (hand-animated) ----------
const FLASH = [1.9, 2.8, 3.6], VIDEO = 4.3, GATHER = 5.0, DROP = [6.7, 7.2, 7.7, 8.2], TO_DRIVE = 9.2, SYNC = 10.2, DONE = 12.7;
const ARCH = { cx: 700, by: 650, r: 265 };
const balloons = Array.from({ length: 11 }, (_, i) => { const a = Math.PI - i / 10 * Math.PI, r = 60 + (i * 7 % 3) * 9;
  return { x: ARCH.cx + Math.cos(a) * ARCH.r, y: ARCH.by - Math.sin(a) * ARCH.r, r, c: ["pk", "w", "wm"][i % 3] }; });
const balloon = (b) => `<circle class="${b.c}" r="${b.r}"/><path class="hl ${b.c === "w" ? "d" : ""}" d="M${-b.r * .55} ${-b.r * .2} a${b.r * .6} ${b.r * .6} 0 0 1 ${b.r * .32} ${-b.r * .38}"/>`;
const cardSvg = (i) => `<g id="c${i}" opacity="0"><rect class="sh" x="-77" y="-93" width="170" height="210" rx="12"/><rect class="w" x="-85" y="-105" width="170" height="210" rx="12"/>
  <rect class="thin ${["wm", "pk", "cr", "wm"][i]}" x="-69" y="-89" width="138" height="146" rx="6"/>${i < 3 ? miniArch(0, 30, 40) : `<circle class="ik" cx="0" cy="-16" r="34"/><path class="w ns" d="M-11 -34 l30 18 l-30 18 z"/>`}
  <path class="thin faint" d="M-50 80 h${i < 3 ? 70 : 100}"/></g>`;
const openArt = `
  <g id="job"><ellipse class="sh" cx="700" cy="668" rx="390" ry="16"/><path d="M300 650 h800" id="ground"/>
    ${balloons.map((b, i) => `<g id="b${i}">${balloon(b)}</g>`).join("")}
    <g id="phone"><rect class="sh" x="-101" y="-204" width="230" height="440" rx="40"/><rect class="w" x="-115" y="-220" width="230" height="440" rx="40"/>
      <rect class="wm thin" x="-97" y="-186" width="194" height="318" rx="20"/><rect class="ik ns" x="-26" y="-208" width="52" height="10" rx="5"/>${miniArch(0, 40, 58)}
      <path class="thin" d="M-80 -140 v-28 h28 M52 -168 h28 v28 M80 86 v28 h-28 M-52 114 h-28 v-28"/>
      <circle class="w" cx="0" cy="176" r="27"/><circle class="pk thin" id="btn" cx="0" cy="176" r="18"/>
      <g id="burst" opacity="0"><path d="M130 -236 l44 -44 M150 -190 l60 -12 M92 -252 l10 -58"/></g></g></g>
  <g id="fback"><ellipse class="sh" cx="0" cy="18" rx="300" ry="16"/><path class="w" d="M-262 0 V-316 q0 -18 18 -18 h150 l42 44 h296 q18 0 18 18 V0 z"/></g>
  <g id="cards">${[0, 1, 2, 3].map(cardSvg).join("")}</g>
  <g id="ffront"><path class="wm" d="M-294 -236 q-4 -18 16 -18 h556 q20 0 16 18 l-30 220 q-2 16 -18 16 h-492 q-16 0 -18 -16 z"/>
    <rect class="w thin" x="-70" y="-150" width="140" height="56" rx="8"/><path class="thin faint" d="M-44 -122 h88"/>
    <g id="badge"><circle class="pk" cx="262" cy="-246" r="36"/><text class="num" id="count" x="262" y="-235" text-anchor="middle">1</text></g></g>
  <path id="link" class="dash" d="M820 470 Q1010 360 1180 450" style="opacity:0"/>
  <g>${[0, 1, 2, 3, 4].map((i) => `<rect id="d${i}" class="${i % 2 ? "w" : "pk"} thin" x="-15" y="-19" width="30" height="38" rx="5" opacity="0"/>`).join("")}</g>
  <g id="cloud" opacity="0"><path class="sh" transform="translate(12 14)" d="M-140 90 a80 80 0 0 1 -6 -160 a112 112 0 0 1 214 -22 a100 100 0 0 1 72 182 z"/><path class="w" d="M-140 90 a80 80 0 0 1 -6 -160 a112 112 0 0 1 214 -22 a100 100 0 0 1 72 182 z"/>
    <g id="arrows"><path d="M-44 6 a44 44 0 0 1 76 -32 m4 -24 v26 h-26"/><path d="M44 6 a44 44 0 0 1 -76 32 m-4 24 v-26 h26"/></g>
    <g id="tickwrap" opacity="0"><circle class="pk" cx="0" cy="6" r="56"/><path id="tick" pathLength="1" stroke-dasharray="1" d="M-26 8 l18 20 l34 -42" style="stroke-width:7"/></g></g>
  <text id="dlabel" class="lab" x="1370" y="640" text-anchor="middle" opacity="0">GOOGLE DRIVE</text>
  <g>${[[1150, 250, 1], [1590, 300, .8], [1620, 560, .6], [1130, 620, .55]].map(([x, y, s], k) => `<path id="k${k}" class="${k % 2 ? "w" : "pk"} thin" data-x="${x}" data-y="${y}" data-s="${s}" d="M0 -26 l7 19 l19 7 l-19 7 l-7 19 l-7 -19 l-19 -7 l19 -7 z"/>`).join("")}</g>`;
const PHONE = { x: 1310, y: 450 }, PILE = [[1590, 770, -10], [1612, 756, 7], [1580, 744, -3], [1620, 730, 12]];
const FAN = [0, 1, 2, 3].map((i) => [960 + (i - 1.5) * 200, 290 + Math.abs(i - 1.5) * 28, (i - 1.5) * 9]);
const bez = (u) => [(1 - u) ** 2 * 820 + 2 * (1 - u) * u * 1010 + u * u * 1180, (1 - u) ** 2 * 470 + 2 * (1 - u) * u * 360 + u * u * 450];
const openUpdate = (t) => {
  const leave = inOut(P(t, GATHER, 1));
  $("job").setAttribute("transform", `translate(${-1500 * leave} 0)`); $("job").setAttribute("opacity", 1 - P(t, GATHER + .5, .5));
  $("ground").style.strokeDasharray = 800; $("ground").style.strokeDashoffset = 800 * (1 - inOut(P(t, 0, .7)));
  balloons.forEach((b, i) => { const k = P(t, .15 + i * .07, .5); tf($("b" + i), b.x, b.y + 3 * Math.sin(t * 1.6 + i * 1.3), k ? outBack(k) * (1 + .015 * Math.sin(t * 2.2 + i)) : 0); });
  const shot = Math.max(...FLASH.map((f) => bump((t - f + .08) / .3)));
  tf($("phone"), mix(2150, PHONE.x, outBack(P(t, .8, .7))), PHONE.y + 7 * Math.sin(t * 2) + 10 * shot, 1 - .03 * shot, 1 - .03 * shot, -6 + 2 * Math.sin(t * 1.3));
  $("btn").setAttribute("r", 18 - 6 * shot);
  $("flash").style.opacity = .88 * Math.max(...FLASH.map((f) => (t < f ? 0 : t < f + .04 ? (t - f) / .04 : Math.max(0, 1 - (t - f - .04) / .32))));
  $("burst").setAttribute("opacity", Math.max(...FLASH.map((f) => bump((t - f) / .35))));
  const born = [...FLASH.map((f) => f + .06), VIDEO];
  [0, 1, 2, 3].forEach((i) => { const el = $("c" + i);
    if (t < born[i]) return el.setAttribute("opacity", 0);
    const a = outCubic(P(t, born[i], .65)), g = inOut(P(t, GATHER + i * .08, .95)), d = inCubic(P(t, DROP[i], .45));
    let x = mix(PHONE.x, PILE[i][0], a), y = mix(PHONE.y - 30, PILE[i][1], a) - 150 * bump(a) * (1 - a * .4), r = mix(-6, PILE[i][2], a) + 40 * (1 - a) * (i % 2 ? 1 : -1), s = mix(.35, 1, a);
    x = mix(x, FAN[i][0], g); y = mix(y, FAN[i][1], g) - 60 * bump(g); r = mix(r, FAN[i][2], g);
    if (g >= 1 && d === 0) y += 8 * Math.sin(t * 3 + i * 1.4);
    x = mix(x, 960, d); y = mix(y, 600, d) - 70 * bump(d) * (1 - d); r = mix(r, 0, d); s = mix(s, .72, d);
    tf(el, x, y, s, s, r); el.setAttribute("opacity", 1 - P(t, DROP[i] + .36, .1)); });
  const fin = P(t, GATHER + .5, .6), move = inOut(P(t, TO_DRIVE, .9)), sq = Math.max(...DROP.map((d) => bump((t - d - .38) / .32)));
  const fs = mix(.6, 1, outBack(fin)) * mix(1, .8, move), fx = mix(960, 560, move), fy = mix(650, 610, move);
  for (const id of ["fback", "ffront"]) { tf($(id), fx, fy, fs * (1 + .05 * sq), fs * (1 - .08 * sq)); $(id).setAttribute("opacity", fin ? cl(fin * 3) : 0); }
  const landed = DROP.filter((d) => t >= d + .4).length; $("count").textContent = landed || 1;
  $("badge").setAttribute("transform", `translate(262 -246) scale(${landed ? 1 + .25 * Math.max(...DROP.map((d) => bump((t - d - .4) / .3))) : 0}) translate(-262 246)`);
  const cin = P(t, TO_DRIVE + .4, .6), done = P(t, DONE, .3);
  $("cloud").setAttribute("opacity", cl(cin * 3)); tf($("cloud"), 1370, 440 + 6 * Math.sin(t * 1.5), outBack(cin) * (1 + .1 * bump((t - DONE) / .4)));
  $("dlabel").setAttribute("opacity", P(t, TO_DRIVE + .8, .4));
  $("link").style.opacity = .5 * P(t, TO_DRIVE + .7, .4) * (1 - P(t, DONE - .2, .4) * .6); $("link").style.strokeDashoffset = -t * 40;
  $("arrows").setAttribute("transform", `translate(0 6) rotate(${Math.max(0, t - SYNC) * 300}) scale(${1 - done}) translate(0 -6)`); $("arrows").setAttribute("opacity", P(t, TO_DRIVE + .7, .3));
  $("tickwrap").setAttribute("opacity", done ? 1 : 0); $("tickwrap").setAttribute("transform", `translate(0 6) scale(${outBack(done)}) translate(0 -6)`);
  $("tick").style.strokeDashoffset = 1 - outCubic(P(t, DONE + .15, .35));
  [0, 1, 2, 3, 4].forEach((i) => { const u = (t - SYNC) / 1.1 - i * .4, el = $("d" + i);
    if (u <= 0 || u >= 1 || t > DONE + .3) return el.setAttribute("opacity", 0);
    const [x, y] = bez(inOut(u)); tf(el, x, y, .7 + .5 * bump(u), .7 + .5 * bump(u), u * 200 - 60); el.setAttribute("opacity", cl(bump(u) * 6)); });
  [0, 1, 2, 3].forEach((k) => { const el = $("k" + k); tf(el, +el.dataset.x, +el.dataset.y, outBack(P(t, DONE + .1 + k * .1, .45)) * el.dataset.s * (1 + .15 * Math.sin(t * 5 + k)), undefined, t * 30); });
};
const openSfx = [...Array.from({ length: 11 }, (_, i) => ["pop", .27 + i * .07, .16, 520 + i * 45]), ...FLASH.flatMap((f) => [["shutter", f, .6], ["whoosh", f + .08, .5]]),
  ["blip", VIDEO, .25], ["whoosh", VIDEO + .02, .5], ["bigwhoosh", GATHER, .8], ...DROP.flatMap((d) => [["whoosh", d, .55], ["thud", d + .4, .6]]),
  ["bigwhoosh", TO_DRIVE, .8], ...[0, 1, 2, 3, 4].map((i) => ["tick", SYNC + .3 + i * .44, .1]), ["chime", DONE, .55]];

// ---------- the scenes ----------
// say: [seconds into the scene, spoken line] (fixed) or a single line (the scene lasts as long as the line).
// sfx: [sound, seconds into the scene, loudness]. "late" times count back from the end of the scene.

// ---------- timeline ----------
const LEAD = .6, TAIL = .8, PAN = .35;
const DROP_Y = 48; // moves every drawing down so it sits in the middle of the space above the title
// Shortest a scene may be, so its animation has time to finish even after a short line.
const MIN = { skill: 5, grade: 4.8, best: 5.4, cover: 3.2, resize: 3, reel: 8.2, captions: 11.4, review: 10, copy: 8.8, folders: 5.2, website: 3.6, why: 6.4, loop: 6.6, ask: 7, end: 7.5, kit: 12 };
const VOICE = globalThis.TIMELINE || {}; // seconds of voice per line, written by film.mjs
let at = 0;
const lines = [], events = [];
SCENES.forEach((s, i) => {

  else { const id = s.id; s.dur = Math.max(LEAD + (VOICE[id] ?? 4) + TAIL, MIN[id] || 0); lines.push({ id, text: s.say, at: at + LEAD }); }
  if (i) events.push(["bigwhoosh", at - .3, .45]);
  for (const [type, o, gain, extra] of s.sfx || []) events.push([type, at + (extra === "late" || o < 0 ? s.dur + o : o), gain, typeof extra === "number" ? extra : 0]);
  at += s.dur;
});
window.DURATION = at + .6; window.LINES = lines; window.EVENTS = events; window.STARTS = SCENES.map((s) => [s.start, s.dur]);

// Small things drifting up behind every scene, so the frame is never still.
const AMB = Array.from({ length: 8 }, (_, i) => ({ x: 90 + (i * 233) % 1760, y: (i * 277) % 1200, v: 14 + (i * 7) % 16, r: 10 + (i * 5) % 14, kind: i % 3 }));
svg.innerHTML = `<g id="amb">${AMB.map((a, i) => a.kind === 2 ? `<path id="am${i}" class="w" d="M0 -16 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>` : `<circle id="am${i}" class="${a.kind ? "pk" : "w"}" r="${a.r}"/>`).join("")}</g>` + SCENES.map((s) => `<g id="g-${s.id}">${s.art}</g>`).join("");
const words = (h) => h.split(/(<\/?em>)/).map((tok) => (tok.startsWith("<") ? tok : tok.split(" ").map((w) => (w ? `<span class="wd">${w}</span>` : "")).join(" "))).join("");
$("titles").innerHTML = SCENES.flatMap((s) => (s.titles || [[s.title]]).map((x, k) => `<div class="title" id="t-${s.id}-${k}">${words(x[0])}</div>`)).join("");
// Things that happen near the end of a scene ("late") get their delay from the scene's length.
SCENES.forEach((s) => $("g-" + s.id).querySelectorAll("[data-late]").forEach((el) => {
  const d = s.dur - el.dataset.late;
  el.style.animationDelay = el.dataset.late2 ? `${d}s, ${s.dur - el.dataset.late2}s` : `${d}s`;
}));
let anims;
window.seek = (t) => {
  anims ||= document.getAnimations().map((a) => ({ a, s: SCENES.find((s) => $("g-" + s.id).contains(a.effect.target)) })).filter((x) => x.s);
  if (!window.FITTED) {
    // Stretch each scene's animation so things keep happening for as long as the voice is talking.
    for (const s of SCENES) {
      const ends = anims.filter((x) => x.s === s && !x.a.effect.target.closest("[data-late]")).map((x) => x.a.effect.getComputedTiming().endTime).filter(Number.isFinite);
      s.k = ends.length ? Math.min(1.6, Math.max(1, (s.dur - 1.2) / (Math.max(...ends) / 1000))) : 1;
      $("g-" + s.id).querySelectorAll("[data-late]").forEach((el) => { const d = (s.dur - el.dataset.late) / s.k;
        el.style.animationDelay = el.dataset.late2 ? `${d}s, ${(s.dur - el.dataset.late2) / s.k}s` : `${d}s`; });

  SCENES.forEach((s, i) => {
    const local = t - s.start, g = $("g-" + s.id), last = i === SCENES.length - 1;
    const vis = local > -PAN && (last || local < s.dur + PAN);
    g.style.display = vis ? "" : "none";
    const x = (i ? 1920 * (1 - inOut(P(local, -PAN, PAN * 2))) : 0) - (last ? 0 : 1920 * inOut(P(local, s.dur - PAN, PAN * 2)));
    let zoom = i ? 1 + .04 * cl(local / s.dur) : 1, cx = 960, cy = 460; // a slow push-in on every scene
    if (s.cam) { // or a scene's own camera moves
      const ta = Math.max(0, (local + .15) / (s.k || 1)), n = s.cam.findIndex((c) => c[0] > ta), a = n < 0 ? s.cam.at(-1) : s.cam[Math.max(0, n - 1)], b = n < 0 ? s.cam.at(-1) : s.cam[n];
      const k = b[0] > a[0] ? inOut(P(ta, a[0], b[0] - a[0])) : 1; cx = mix(a[1], b[1], k); cy = mix(a[2], b[2], k); zoom = mix(a[3], b[3], k);
    }
    g.setAttribute("transform", `translate(${x} ${DROP_Y + 5 * Math.sin(t * 1.1 + i)}) translate(960 460) scale(${zoom}) translate(${-cx} ${-cy})`);
    if (vis && s.update) s.update(Math.max(0, local));
    (s.titles || [[s.title, .1, s.dur - PAN]]).forEach(([, a, b], k) => { const el = $(`t-${s.id}-${k}`);
      el.style.opacity = local > a - .05 ? 1 - P(local, b, .3) : 0; el.style.transform = `translateY(${-P(local, b, .3) * 20}px)`;
      [...el.querySelectorAll(".wd")].forEach((w, j) => { const kk = outCubic(P(local, a + j * .09, .45)); w.style.opacity = kk; w.style.transform = `translateY(${(1 - kk) * 36}px) rotate(${(1 - kk) * 4}deg)`; }); });
  });
