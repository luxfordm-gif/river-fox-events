<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>How it works</title>
<style>
@font-face { font-family: Fraunces; font-weight: 400; src: url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Fraunces; font-weight: 400; font-style: italic; src: url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 400; src: url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 500; src: url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "DM Mono"; font-weight: 400; src: url(node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "DM Mono"; font-weight: 500; src: url(node_modules/@fontsource/dm-mono/files/dm-mono-latin-500-normal.woff2) format("woff2"); }

/* Laura's website colours (src/index.css) */
:root {
  --cream: hsl(47 22% 92%);
  --light: hsl(45 36% 98%);
  --warm: hsl(14 42% 93%);
  --ink: hsl(100 8% 10%);
  --neutral: hsl(100 5% 29%);
  --pink: hsl(12 55% 78%);
  --accent-dark: hsl(12 32% 54%);
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); color: var(--ink); font-family: "DM Sans", sans-serif; }
.top { position: absolute; top: 56px; left: 80px; right: 80px; display: flex; justify-content: space-between; font: 500 20px "DM Mono", monospace; letter-spacing: .16em; color: var(--neutral); }
.scene { position: absolute; inset: 0; opacity: 0; }
.scene svg { position: absolute; left: 50%; top: 66px; width: 1280px; height: 693px; margin-left: -640px; overflow: visible; }
.scene.wide svg { top: 120px; }
.step { position: absolute; top: 762px; left: 0; right: 0; text-align: center; }
.step .n { font: 500 24px "DM Mono", monospace; letter-spacing: .16em; color: var(--accent-dark); }
.step h2 { font: 400 64px/1.1 Fraunces, serif; letter-spacing: -.01em; margin-top: 10px; }
.say { position: absolute; top: 902px; left: 200px; right: 200px; text-align: center; font: 400 36px/1.35 "DM Sans", sans-serif; text-wrap: balance; }
.scene.wide .say { top: 860px; font-size: 40px; }
.say span { opacity: .3; }
.bar { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; gap: 10px; }
.bar i { flex: 1; height: 4px; border-radius: 4px; background: var(--ink); opacity: .14; }
.bar i.on { opacity: 1; background: var(--accent-dark); }

/* line art */
svg * { stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg tspan { stroke: none; }
svg text { stroke: none; fill: var(--ink); font-family: "DM Sans", sans-serif; }
.f-white { fill: var(--light); } .f-pink { fill: var(--pink); } .f-warm { fill: var(--warm); } .f-cream { fill: var(--cream); } .f-ink { fill: var(--ink); }
.thick { stroke-width: 4; } .thin { stroke-width: 2; } .soft { opacity: .3; }
.accentline { stroke: var(--accent-dark); stroke-width: 4; }
.onstroke { stroke: var(--cream); }
.dull { fill: var(--ink); opacity: .26; stroke: none; }
.dot { fill: var(--pink); stroke: none; } .tcur { fill: var(--pink); stroke: none; }
svg text.lab { font: 500 17px "DM Mono", monospace; letter-spacing: .14em; fill: var(--neutral); }
svg text.lab.soft { opacity: .65; }
svg text.mono { font: 500 24px "DM Mono", monospace; fill: var(--accent-dark); }
svg text.mono.small { font-size: 17px; fill: var(--neutral); }
svg text.rowname { font: 400 26px "DM Sans", sans-serif; }
svg text.chip { font: 500 22px "DM Sans", sans-serif; }
svg text.onink { fill: var(--cream); }
svg text.big { font: 400 64px Fraunces, serif; letter-spacing: -.01em; }
svg text.cover { font: 400 26px Fraunces, serif; }
svg text.doc { font: 400 28px Fraunces, serif; }
svg .accent { fill: var(--accent-dark); font-style: italic; }
svg text.term { font: 400 24px "DM Mono", monospace; fill: var(--cream); }
svg text.term.dim { opacity: .6; } svg .tpink { fill: var(--pink); }
svg text.cap { font: 500 19px "DM Sans", sans-serif; fill: var(--neutral); }
svg text.cap tspan { opacity: .3; } svg text.cap.dark, svg text.cap.dark tspan { fill: var(--ink); opacity: 1; }
svg text.capbig { font: 400 46px Fraunces, serif; }

.d { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s cubic-bezier(.6,0,.2,1) var(--d,0s) both, show .01s linear var(--d,0s) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,1.4,.4,1) var(--d,0s) both; }
.fade { animation: fade .5s ease var(--d,0s) both; }
.up { animation: up .6s cubic-bezier(.2,.8,.3,1) var(--d,0s) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes out { from { opacity: 1; } to { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes drop { 0% { opacity: 0; transform: translateY(-190px); } 25% { opacity: 1; } 100% { opacity: 1; transform: translateY(70px); } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes handle { from { transform: translateX(0); } to { transform: translateX(360px); } }
@keyframes dim { to { opacity: .28; } }
@keyframes grow { to { transform: scale(1.12); } }
@keyframes shiftR { to { transform: translateX(124px); } }
@keyframes toFront { 0% { transform: none; } 40% { transform: translate(-200px,-70px); } 100% { transform: translateX(-496px); } }
@keyframes say { to { opacity: 1; fill: var(--ink); } }
@keyframes word { 0% { opacity: 0; transform: translateY(14px); } 30%, 99% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes wordstay { 0% { opacity: 0; transform: translateY(14px); } 30%, 100% { opacity: 1; transform: none; } }
@keyframes rowDown { to { transform: translateY(90px); } }
@keyframes rowIn { from { opacity: 0; transform: translateY(-80px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="top"><span>RIVER FOX EVENTS</span><span>FROM JOB TO EVERY CHANNEL</span></div>
<div id="scenes"></div>
<div class="bar" id="bar"></div>
<script src="scenes.js"></script>
<script src="out/timeline.js"></script>
<script>
const LEAD = 0.45; // seconds before the voice starts in each scene
const TL = globalThis.TIMELINE || SCENES.map(() => 5); // seconds of voice per scene
const TAIL = 0.75;
let t0 = 0;
const steps = SCENES.filter(s => s.title).length;
let stepNo = 0;
const scenes = SCENES.map((s, i) => {
  const el = document.createElement("div");
  el.className = "scene" + (s.title ? "" : " wide");
  el.id = s.id;
  const n = s.title ? ++stepNo : 0;
  const words = s.say.split(" ");
  el.innerHTML = `<svg viewBox="0 0 960 520">${s.art}</svg>` +
    (s.title ? `<div class="step"><div class="n">${String(n).padStart(2, "0")} / ${steps}</div><h2>${s.title}</h2></div>` : "") +
    `<p class="say">${words.map(w => `<span>${w}</span>`).join(" ")}</p>`;
  document.getElementById("scenes").appendChild(el);
  el.querySelectorAll(".d").forEach(p => p.setAttribute("pathLength", "1"));
  const total = s.say.length;
  let acc = 0;
  const spans = [...el.querySelectorAll(".say span")].map((sp, k) => {
    const at = acc / total; acc += words[k].length + 1; return { sp, at };
  });
  const sc = { el, start: t0, voice: TL[i], dur: LEAD + TL[i] + TAIL, spans, n };
  t0 += sc.dur;
  return sc;
});
window.DURATION = t0;
window.STARTS = scenes.map(s => s.start);
const bar = document.getElementById("bar");
bar.innerHTML = "<i></i>".repeat(steps);
let anims;
window.seek = (t) => {
  anims ||= document.getAnimations().map(a => ({ a, sc: scenes.find(s => s.el.contains(a.effect.target)) }));
  let cur = scenes.findLast(s => t >= s.start) || scenes[0];
  for (const s of scenes) {
    const local = t - s.start;
    const on = s === cur;
    s.el.style.opacity = on ? Math.min(1, local / 0.3, (s.dur - local) / 0.25 + (s === scenes.at(-1) ? 9 : 0)) : 0;
    if (on) for (const { sp, at } of s.spans) {
      const k = (local - LEAD - at * s.voice * 0.97) / 0.18;
      sp.style.opacity = 0.3 + 0.7 * Math.max(0, Math.min(1, k + 1));
    }
  }
  for (const { a, sc } of anims) { a.pause(); a.currentTime = sc === cur ? Math.max(0, (t - sc.start) * 1000) : 0; }
  [...bar.children].forEach((b, i) => b.classList.toggle("on", cur.n ? i < cur.n : cur === scenes.at(-1)));
};
document.fonts.ready.then(() => { window.READY = true; if (location.hash) seek(parseFloat(location.hash.slice(1))); });
</script>
</body>
</html>
