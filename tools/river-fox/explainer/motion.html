<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Motion test</title>
<style>
@font-face { font-family: Fraunces; font-weight: 400; src: url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Fraunces; font-weight: 400; font-style: italic; src: url(node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "DM Mono"; font-weight: 500; src: url(node_modules/@fontsource/dm-mono/files/dm-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 500; src: url(node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2) format("woff2"); }
:root { --cream: hsl(47 22% 92%); --light: hsl(45 36% 98%); --warm: hsl(14 42% 93%); --ink: hsl(100 8% 10%); --neutral: hsl(100 5% 29%); --pink: hsl(12 55% 78%); --accent-dark: hsl(12 32% 54%); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); color: var(--ink); }
.brand { position: absolute; top: 56px; left: 80px; font: 500 20px "DM Mono", monospace; letter-spacing: .16em; color: var(--neutral); }
svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.title { position: absolute; left: 0; right: 0; top: 880px; text-align: center; opacity: 0; }
.title b { display: block; font: 500 22px "DM Mono", monospace; letter-spacing: .18em; color: var(--accent-dark); }
.title span { display: block; margin-top: 12px; font: 400 80px/1.05 Fraunces, serif; letter-spacing: -.012em; }
.title em { color: var(--accent-dark); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
svg * { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg text { stroke: none; fill: var(--ink); }
.w { fill: var(--light); } .pk { fill: var(--pink); } .wm { fill: var(--warm); } .cr { fill: var(--cream); } .ik { fill: var(--ink); }
.sh { fill: var(--ink); stroke: none; opacity: .09; }
.hl { stroke: var(--light); stroke-width: 5; opacity: .9; } .hl.d { stroke: var(--ink); opacity: .25; stroke-width: 3; }
.thin { stroke-width: 3; } .ns { stroke: none; }
.dash { stroke-dasharray: 2 16; stroke-width: 5; opacity: .5; }
.lab { font: 500 22px "DM Mono", monospace; letter-spacing: .18em; fill: var(--neutral); }
.num { font: 500 30px "DM Sans", sans-serif; }
</style>
</head>
<body>
<div class="brand">RIVER FOX EVENTS</div>
<svg viewBox="0 0 1920 1080" id="svg"></svg>
<div class="title" id="t0"><b>01</b><span>Laura <em>takes the photos.</em></span></div>
<div class="title" id="t1"><b>02</b><span>They land in <em>one folder.</em></span></div>
<div class="title" id="t2"><b>03</b><span>It syncs to <em>Google Drive.</em></span></div>
<div id="flash"></div>
<script>
// Timings (seconds). motion-sound.py uses the same numbers for the sound effects.
const FLASH = [1.9, 2.8, 3.6], VIDEO = 4.3, GATHER = 5.0, DROP = [6.7, 7.2, 7.7, 8.2], TO_DRIVE = 9.2, SYNC = 10.2, DONE = 12.7;
window.DURATION = 14.5;

const cl = (x) => Math.max(0, Math.min(1, x));
const P = (t, s, d) => cl((t - s) / d);
const outCubic = (x) => 1 - (1 - x) ** 3, inCubic = (x) => x ** 3;
const inOut = (x) => (x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const outBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
const mix = (a, b, k) => a + (b - a) * k;
const bump = (x) => Math.sin(Math.PI * cl(x));

const miniArch = (cx, by, r, n = 7) => Array.from({ length: n }, (_, i) => { const a = Math.PI - i / (n - 1) * Math.PI;
  return `<circle class="thin ${["pk", "w", "wm"][i % 3]}" cx="${cx + Math.cos(a) * r}" cy="${by - Math.sin(a) * r}" r="${r * .27}"/>`; }).join("");

// Big balloon arch
const ARCH = { cx: 700, by: 650, r: 265 };
const balloons = Array.from({ length: 11 }, (_, i) => { const a = Math.PI - i / 10 * Math.PI, r = 60 + (i * 7 % 3) * 9;
  return { x: ARCH.cx + Math.cos(a) * ARCH.r, y: ARCH.by - Math.sin(a) * ARCH.r, r, c: ["pk", "w", "wm"][i % 3] }; });
const balloonSvg = balloons.map((b, i) => `<g id="b${i}"><circle class="${b.c}" r="${b.r}"/><path class="hl ${b.c === "w" ? "d" : ""}" d="M${-b.r * .55} ${-b.r * .2} a${b.r * .6} ${b.r * .6} 0 0 1 ${b.r * .32} ${-b.r * .38}"/></g>`).join("");

const cardSvg = (i) => `<g id="c${i}" opacity="0"><rect class="sh" x="-77" y="-93" width="170" height="210" rx="12"/><rect class="w" x="-85" y="-105" width="170" height="210" rx="12"/>
  <rect class="thin ${["wm", "pk", "cr", "wm"][i]}" x="-69" y="-89" width="138" height="146" rx="6"/>${i < 3 ? miniArch(0, 30, 40) + `<path class="thin" d="M-52 30 h104"/>` : `<circle class="ik" cx="0" cy="-16" r="34"/><path class="w ns" d="M-11 -34 l30 18 l-30 18 z"/>`}
  <path class="thin" style="opacity:.3" d="M-50 80 h${i < 3 ? 70 : 100}"/></g>`;

svg.innerHTML = `
  <g id="job">
    <ellipse class="sh" cx="700" cy="668" rx="390" ry="16"/>
    <path d="M300 650 h800" id="ground"/>
    ${balloonSvg}
    <g id="tw">${[[380, 250, 1], [1010, 230, .7], [250, 470, .6]].map(([x, y, s], k) => `<path id="s${k}" class="${k ? "w" : "pk"} thin" transform="translate(${x} ${y}) scale(${s})" d="M0 -26 l7 19 l19 7 l-19 7 l-7 19 l-7 -19 l-19 -7 l19 -7 z"/>`).join("")}</g>
    <g id="phone">
      <rect class="sh" x="-101" y="-204" width="230" height="440" rx="40"/>
      <rect class="w" x="-115" y="-220" width="230" height="440" rx="40"/>
      <rect class="wm thin" x="-97" y="-186" width="194" height="318" rx="20"/>
      <rect class="ik ns" x="-26" y="-208" width="52" height="10" rx="5"/>
      ${miniArch(0, 40, 58)}<path class="thin" d="M-76 40 h152"/>
      <path class="thin" d="M-80 -140 v-28 h28 M52 -168 h28 v28 M80 86 v28 h-28 M-52 114 h-28 v-28"/>
      <circle class="w" cx="0" cy="176" r="27"/><circle class="pk thin" id="btn" cx="0" cy="176" r="18"/>
      <g id="burst" opacity="0"><path d="M130 -236 l44 -44 M150 -190 l60 -12 M92 -252 l10 -58"/></g>
    </g>
  </g>
  <g id="fback"><ellipse class="sh" cx="0" cy="18" rx="300" ry="16"/><path class="w" d="M-262 0 V-316 q0 -18 18 -18 h150 l42 44 h296 q18 0 18 18 V0 z"/></g>
  <g id="cards">${[0, 1, 2, 3].map(cardSvg).join("")}</g>
  <g id="ffront"><path class="wm" d="M-294 -236 q-4 -18 16 -18 h556 q20 0 16 18 l-30 220 q-2 16 -18 16 h-492 q-16 0 -18 -16 z"/>
    <rect class="w thin" x="-70" y="-150" width="140" height="56" rx="8"/><path class="thin" style="opacity:.35" d="M-44 -122 h88"/>
    <g id="badge"><circle class="pk" cx="262" cy="-246" r="36"/><text class="num" id="count" x="262" y="-235" text-anchor="middle">1</text></g></g>
  <path id="link" class="dash" d="M820 470 Q1010 360 1180 450" opacity="0"/>
  <g id="dots">${[0, 1, 2, 3, 4].map((i) => `<rect id="d${i}" class="${i % 2 ? "w" : "pk"} thin" x="-15" y="-19" width="30" height="38" rx="5" opacity="0"/>`).join("")}</g>
  <g id="cloud" opacity="0">
    <path class="sh" transform="translate(12 14)" d="M-140 90 a80 80 0 0 1 -6 -160 a112 112 0 0 1 214 -22 a100 100 0 0 1 72 182 z"/>
    <path class="w" d="M-140 90 a80 80 0 0 1 -6 -160 a112 112 0 0 1 214 -22 a100 100 0 0 1 72 182 z"/>
    <g id="arrows"><path d="M-44 6 a44 44 0 0 1 76 -32 m4 -24 v26 h-26"/><path d="M44 6 a44 44 0 0 1 -76 32 m-4 24 v-26 h26"/></g>
    <g id="tickwrap" opacity="0"><circle class="pk" cx="0" cy="6" r="56"/><path id="tick" pathLength="1" stroke-dasharray="1" d="M-26 8 l18 20 l34 -42" style="stroke-width:7"/></g>
  </g>
  <text id="dlabel" class="lab" x="1370" y="640" text-anchor="middle" opacity="0">GOOGLE DRIVE</text>
  <g id="sparks">${[[1150, 250, 1], [1590, 300, .8], [1620, 560, .6], [1130, 620, .55]].map(([x, y, s], k) => `<path id="k${k}" class="${k % 2 ? "w" : "pk"} thin" data-x="${x}" data-y="${y}" data-s="${s}" d="M0 -26 l7 19 l19 7 l-19 7 l-7 19 l-7 -19 l-19 -7 l19 -7 z"/>`).join("")}</g>`;

const $ = (id) => document.getElementById(id);
const tf = (el, x, y, sx = 1, sy = sx, r = 0) => el.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${sx} ${sy})`);
const PHONE = { x: 1310, y: 450 }, PILE = [[1590, 770, -10], [1612, 756, 7], [1580, 744, -3], [1620, 730, 12]];
const FAN = [0, 1, 2, 3].map((i) => [960 + (i - 1.5) * 200, 290 + Math.abs(i - 1.5) * 28, (i - 1.5) * 9]);
const bez = (u) => [(1 - u) ** 2 * 820 + 2 * (1 - u) * u * 1010 + u * u * 1180, (1 - u) ** 2 * 470 + 2 * (1 - u) * u * 360 + u * u * 450];

window.seek = (t) => {
  // Scene 1: arch, phone, flashes
  const leave = inOut(P(t, GATHER, 1));
  $("job").setAttribute("transform", `translate(${-1500 * leave} 0)`);
  $("job").setAttribute("opacity", 1 - P(t, GATHER + .5, .5));
  $("ground").style.strokeDasharray = 800; $("ground").style.strokeDashoffset = 800 * (1 - inOut(P(t, 0, .7)));
  balloons.forEach((b, i) => { const k = P(t, .15 + i * .07, .5), wob = 1 + .015 * Math.sin(t * 2.2 + i);
    tf($("b" + i), b.x, b.y + 3 * Math.sin(t * 1.6 + i * 1.3), k ? outBack(k) * wob : 0); });
  [0, 1, 2].forEach((k) => { const el = $("s" + k), base = el.getAttribute("data-b") || (el.setAttribute("data-b", el.getAttribute("transform")), el.getAttribute("transform"));
    el.setAttribute("transform", `${base} scale(${outBack(P(t, 1 + k * .2, .4)) * (1 + .18 * Math.sin(t * 4 + k * 2))}) rotate(${t * 20})`); });
  const pin = outBack(P(t, .8, .7));
  const shot = Math.max(...FLASH.map((f) => bump((t - f + .08) / .3)));
  tf($("phone"), mix(2150, PHONE.x, pin), PHONE.y + 7 * Math.sin(t * 2) + 10 * shot, 1 - .03 * shot, 1 - .03 * shot, -6 + 2 * Math.sin(t * 1.3));
  $("btn").setAttribute("r", 18 - 6 * shot);
  const fl = Math.max(...FLASH.map((f) => (t < f ? 0 : t < f + .04 ? (t - f) / .04 : Math.max(0, 1 - (t - f - .04) / .32))));
  $("flash").style.opacity = fl * .88;
  $("burst").setAttribute("opacity", Math.max(...FLASH.map((f) => bump((t - f) / .35))));

  // Photo cards: out of the phone, onto a pile, into a fan, then into the folder
  const born = [...FLASH.map((f) => f + .06), VIDEO];
  [0, 1, 2, 3].forEach((i) => {
    const el = $("c" + i);
    if (t < born[i]) return el.setAttribute("opacity", 0);
    const a = outCubic(P(t, born[i], .65)), g = inOut(P(t, GATHER + i * .08, .95)), d = inCubic(P(t, DROP[i], .45));
    let x = mix(PHONE.x, PILE[i][0], a), y = mix(PHONE.y - 30, PILE[i][1], a) - 150 * bump(a) * (1 - a * .4), r = mix(-6, PILE[i][2], a) + 200 * (1 - a) * (i % 2 ? 1 : -1) * .2, s = mix(.35, 1, a);
    x = mix(x, FAN[i][0], g); y = mix(y, FAN[i][1], g) - 60 * bump(g); r = mix(r, FAN[i][2], g);
    if (g >= 1 && d === 0) y += 8 * Math.sin(t * 3 + i * 1.4);
    x = mix(x, 960, d); y = mix(y, 600, d) - 70 * bump(d) * (1 - d); r = mix(r, 0, d); s = mix(s, .72, d);
    tf(el, x, y, s, s, r);
    el.setAttribute("opacity", 1 - P(t, DROP[i] + .36, .1));
  });

  // Folder
  const fin = P(t, GATHER + .5, .6), move = inOut(P(t, TO_DRIVE, .9));
  const sq = Math.max(...DROP.map((d) => bump((t - d - .38) / .32)));
  const fs = mix(.6, 1, outBack(fin)) * mix(1, .8, move), fx = mix(960, 560, move), fy = mix(650, 610, move);
  for (const id of ["fback", "ffront"]) { tf($(id), fx, fy, fs * (1 + .05 * sq), fs * (1 - .08 * sq)); $(id).setAttribute("opacity", fin ? cl(fin * 3) : 0); }
  const landed = DROP.filter((d) => t >= d + .4).length;
  $("count").textContent = landed || 1;
  const bp = Math.max(...DROP.map((d) => bump((t - d - .4) / .3)));
  $("badge").setAttribute("transform", `translate(262 -246) scale(${landed ? 1 + .25 * bp : 0}) translate(-262 246)`);

  // Google Drive
  const cin = P(t, TO_DRIVE + .4, .6), done = P(t, DONE, .3);
  $("cloud").setAttribute("opacity", cl(cin * 3));
  tf($("cloud"), 1370, 440 + 6 * Math.sin(t * 1.5), outBack(cin) * (1 + .1 * bump((t - DONE) / .4)));
  $("dlabel").setAttribute("opacity", P(t, TO_DRIVE + .8, .4));
  $("link").style.opacity = .5 * P(t, TO_DRIVE + .7, .4) * (1 - P(t, DONE - .2, .4) * .6);
  $("link").style.strokeDashoffset = -t * 40;
  $("arrows").setAttribute("transform", `translate(0 6) rotate(${Math.max(0, t - SYNC) * 300}) scale(${1 - done}) translate(0 -6)`);
  $("arrows").setAttribute("opacity", P(t, TO_DRIVE + .7, .3));
  $("tickwrap").setAttribute("opacity", done ? 1 : 0);
  $("tickwrap").setAttribute("transform", `translate(0 6) scale(${outBack(done)}) translate(0 -6)`);
  $("tick").style.strokeDashoffset = 1 - outCubic(P(t, DONE + .15, .35));
  [0, 1, 2, 3, 4].forEach((i) => { const u = (t - SYNC) / 1.1 - i * .4, el = $("d" + i);
    if (u <= 0 || u >= 1 || t > DONE + .3) return el.setAttribute("opacity", 0);
    const [x, y] = bez(inOut(u)); tf(el, x, y, .7 + .5 * bump(u), .7 + .5 * bump(u), u * 200 - 60); el.setAttribute("opacity", bump(u * 1.02) > .15 ? 1 : bump(u) * 6); });
  [0, 1, 2, 3].forEach((k) => { const el = $("k" + k), k0 = outBack(P(t, DONE + .1 + k * .1, .45));
    tf(el, +el.dataset.x, +el.dataset.y, k0 * el.dataset.s * (1 + .15 * Math.sin(t * 5 + k)), undefined, t * 30); });

  // Titles
  [[.3, GATHER - .1], [GATHER + .4, TO_DRIVE], [TO_DRIVE + .5, 99]].forEach(([a, b], i) => { const k = outCubic(P(t, a, .5)) * (1 - P(t, b, .3));
    $("t" + i).style.opacity = k; $("t" + i).style.transform = `translateY(${(1 - outCubic(P(t, a, .5))) * 30 - P(t, b, .3) * 20}px)`; });
};
document.fonts.ready.then(() => { seek(0); window.READY = true; });
</script>
</body>
</html>
