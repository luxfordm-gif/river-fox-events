<title>River Fox Instagram preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: laptop = a phone frame beside a control panel; phone = the screen fills the page, controls in a sheet. */
:root {
  --stage: #ECEAE6;
  --stage-fg: #2A2C28;
  --stage-sub: #6A6D66;
  --panel: #FFFFFF;
  --panel-line: #DDDAD4;
  --accent: #5D554B;

  --ig-bg: #FFFFFF;
  --ig-fg: #0C1014;
  --ig-sub: #737373;
  --ig-line: #DBDBDB;
  --ig-btn: #EFEFEF;
  --ig-blue: #0095F6;
  --ig-link: #00376B;
  --ig-tile: #EFEFEF;
  --ig-next: #0095F6;
  --ig-ring-a: #F9CE34;
  --ig-ring-b: #EE2A7B;
  --ig-ring-c: #6228D7;
  --safe: #FF3B6B;
  --bezel: #1B1C1A;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-ui: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #161715; --stage-fg: #ECEAE4; --stage-sub: #A3A69E; --panel: #20221F; --panel-line: #34372F; --accent: #CDBFAE;
    --ig-bg: #000000; --ig-fg: #F5F5F5; --ig-sub: #A8A8A8; --ig-line: #262626; --ig-btn: #262626; --ig-link: #E0F1FF; --ig-tile: #1C1C1C;
    --bezel: #3A3B38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #161715; --stage-fg: #ECEAE4; --stage-sub: #A3A69E; --panel: #20221F; --panel-line: #34372F; --accent: #CDBFAE;
  --ig-bg: #000000; --ig-fg: #F5F5F5; --ig-sub: #A8A8A8; --ig-line: #262626; --ig-btn: #262626; --ig-link: #E0F1FF; --ig-tile: #1C1C1C;
  --bezel: #3A3B38; color-scheme: dark;
}
/* The app's own light/dark switch in the controls overrides the viewer theme inside the phone only. */
.phone[data-app="light"] { --ig-bg: #FFFFFF; --ig-fg: #0C1014; --ig-sub: #737373; --ig-line: #DBDBDB; --ig-btn: #EFEFEF; --ig-link: #00376B; --ig-tile: #EFEFEF; color-scheme: light; }
.phone[data-app="dark"] { --ig-bg: #000000; --ig-fg: #F5F5F5; --ig-sub: #A8A8A8; --ig-line: #262626; --ig-btn: #262626; --ig-link: #E0F1FF; --ig-tile: #1C1C1C; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--stage); color: var(--stage-fg); font-family: var(--font-ui); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--ig-blue); outline-offset: 2px; }
svg { display: block; }

/* ---------- stage ---------- */
.stage { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; gap: 40px; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { position: relative; width: 390px; height: 844px; flex: none; border-radius: 54px; padding: 12px; background: var(--bezel); box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--ig-bg); color: var(--ig-fg); font-family: var(--font); font-size: 14px; line-height: 18px; isolation: isolate; }
.status { position: absolute; inset: 0 0 auto; height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 38px; font-weight: 600; font-size: 16px; z-index: 50; pointer-events: none; color: var(--ig-fg); }
.status.on-dark { color: #fff; }
.status .island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
.status .icons { display: flex; gap: 6px; align-items: center; }

/* On a phone the page is the screen. */
@media (max-width: 699px) {
  .stage { padding: 0; display: block; height: 100%; }
  .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; background: none; box-shadow: none; }
  .screen { border-radius: 0; }
  .status { display: none; }
  .app { inset: 0; }
  .panel-wrap { display: none; }
}

/* ---------- profile ---------- */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ig-bg); }
.scroll { position: relative; flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.topbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; }
.topbar .name { display: flex; align-items: center; gap: 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.topbar .acts { display: flex; gap: 20px; }
.head { display: flex; align-items: center; gap: 24px; padding: 8px 16px 12px; }
.avatar { position: relative; width: 86px; height: 86px; flex: none; border-radius: 50%; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--ig-tile); }
.avatar.ringed { padding: 4px; background: conic-gradient(from 200deg, var(--ig-ring-a), var(--ig-ring-b), var(--ig-ring-c), var(--ig-ring-a)); }
.avatar.ringed img { border: 3px solid var(--ig-bg); }
.avatar .plus { position: absolute; right: 0; bottom: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--ig-fg); color: var(--ig-bg); border: 3px solid var(--ig-bg); display: grid; place-items: center; }
.stats { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); text-align: left; }
.stats b { display: block; font-size: 17px; line-height: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; }
.bio { padding: 0 16px; }
.bio .nm { font-weight: 600; }
.bio .ln { white-space: pre-wrap; }
.bio .link { color: var(--ig-link); font-weight: 600; display: flex; gap: 4px; align-items: center; margin-top: 2px; }
.btns { display: flex; gap: 6px; padding: 14px 16px 4px; }
.btns .b { flex: 1; height: 32px; border-radius: 8px; background: var(--ig-btn); font-weight: 600; display: grid; place-items: center; }
.btns .b.sq { flex: none; width: 34px; }
.hls { display: flex; gap: 16px; overflow-x: auto; padding: 14px 16px 14px; scrollbar-width: none; }
.hls::-webkit-scrollbar { display: none; }
.hl { flex: none; width: 64px; text-align: center; font-size: 12px; }
.hl .c { width: 64px; height: 64px; border-radius: 50%; padding: 2px; border: 1px solid var(--ig-line); }
.hl img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.hl .t { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--ig-bg); border-bottom: 1px solid var(--ig-line); }
.tabs button { height: 44px; display: grid; place-items: center; color: var(--ig-sub); position: relative; }
.tabs button[aria-selected="true"] { color: var(--ig-fg); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: -1px; height: 1px; background: var(--ig-fg); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.tile { position: relative; aspect-ratio: 3 / 4; max-width: 100%; background: var(--ig-tile); overflow: hidden; }
.grid.reels .tile { aspect-ratio: 9 / 16; }
.tile img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
.tile .badge { position: absolute; top: 6px; right: 6px; color: #fff; filter: drop-shadow(0 0 2px rgba(0,0,0,.5)); }
.tile .next { position: absolute; top: 6px; left: 6px; background: var(--ig-next); color: #fff; font: 600 10px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 4px; }
.hide-next .tile .next, .hide-next .post .next { display: none; }
.next.redo { background: #2E7D4F; }
.empty { padding: 48px 32px; text-align: center; color: var(--ig-sub); }
.empty b { display: block; color: var(--ig-fg); font-size: 20px; line-height: 24px; margin-bottom: 8px; }
.note { padding: 16px; color: var(--ig-sub); font-size: 13px; text-align: center; }
.navbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; border-top: 1px solid var(--ig-line); background: var(--ig-bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.navbar button { display: grid; place-items: center; height: 50px; }
.navbar.on-dark { background: #000; border-top-color: #262626; color: #fff; }

.navbar .me img { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ig-fg); padding: 1px; object-fit: cover; }

/* ---------- feed (Posts) ---------- */
.slide { transform: translateX(100%); transition: transform 280ms cubic-bezier(.2,.8,.2,1); z-index: 10; }
.slide.open { transform: none; }
.post { border-bottom: 0; padding-bottom: 14px; }
.post .ph { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px 0 14px; }
.post .ph img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.post .ph .u { flex: 1; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.post .media { position: relative; width: 100%; max-width: 100%; background: var(--ig-tile); overflow: hidden; }
.post .media img { width: 100%; height: 100%; object-fit: cover; display: block; }

.post .next { position: static; display: inline-block; background: var(--ig-next); color: #fff; font: 600 10px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 4px; }
.post .acts { display: flex; align-items: center; gap: 14px; padding: 10px 14px 6px; }
.post .acts .sp { flex: 1; }
.post .likes { padding: 0 14px; font-weight: 600; }
.post .cap { padding: 4px 14px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.post .cap.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.post .cap b { font-weight: 600; }
.post .more { padding: 0 14px; color: var(--ig-sub); }
.post .meta { padding: 4px 14px 0; color: var(--ig-sub); font-size: 12px; }

.dark { background: #000; color: #fff; z-index: 20; }
.reels { position: relative; flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.reels::-webkit-scrollbar { display: none; }
.reel { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid; align-items: center; overflow: hidden; }
.frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; overflow: hidden; background: #111; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reel .frame { align-self: start; }
.ui-grad { position: absolute; inset: auto 0 0; height: 40%; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); pointer-events: none; }
.reel .side { position: absolute; right: 10px; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 18px; font-size: 12px; font-weight: 600; text-align: center; }
.reel .side .sq { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #fff; overflow: hidden; }
.reel .side .sq img { width: 100%; height: 100%; object-fit: cover; }
.reel .info { position: absolute; left: 14px; right: 72px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
.reel .who { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.reel .who img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.reel .who .fb { border: 1px solid rgba(255,255,255,.7); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.reel .rc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reel .au { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.vtop { position: absolute; inset: 0 0 auto; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; z-index: 5; color: #fff; }
.vtop .tt { font-size: 22px; font-weight: 700; }
.vtop button, .vback { width: 36px; height: 36px; display: grid; place-items: center; }
.reel-q { position: absolute; top: 56px; left: 14px; }
.reel-q .next { background: var(--ig-next); color: #fff; font: 600 10px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 4px; }
.hide-next .reel-q { display: none; }

.story { flex: 1; display: flex; flex-direction: column; }
.story .frame { border-radius: 8px; margin-top: 0; }
.story .bars { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 3px; z-index: 3; }

.story .bars i b { display: block; height: 100%; width: 0; background: #fff; }
.story .sh { position: absolute; top: 18px; left: 12px; right: 6px; display: flex; align-items: center; gap: 8px; z-index: 3; font-weight: 600; text-shadow: 0 0 4px rgba(0,0,0,.3); }
.story .sh img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.story .sh .ago { font-weight: 400; opacity: .8; }
.story .sh .sp { flex: 1; }
.story .tapzones { position: absolute; inset: 60px 0 0; display: grid; grid-template-columns: 1fr 2fr; z-index: 2; }
.story .reply { flex: 1; display: flex; align-items: center; gap: 16px; padding: 10px 14px; }
.story .reply .in { flex: 1; height: 44px; border: 1px solid rgba(255,255,255,.55); border-radius: 22px; display: flex; align-items: center; padding: 0 16px; color: rgba(255,255,255,.85); }
.story .sq-label { position: absolute; top: 60px; left: 12px; z-index: 3; }
.story .sq-label .next { background: var(--ig-next); color: #fff; font: 600 10px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 4px; }
.hide-next .sq-label { display: none; }

/* Safe-area lines from the River Fox Brand Pack (values copied into the page when it is built). */
.safe { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 4; }
.show-safe .safe { display: block; }
.safe i { position: absolute; border: 1.5px dashed var(--safe); }

.panel-wrap { width: 320px; flex: none; position: sticky; top: 32px; }

.panel p { margin: 0; color: var(--stage-sub); font-size: 13px; line-height: 1.45; }
.panel h2 { margin: 0 0 8px; font: 600 11px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--stage-sub); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; min-height: 32px; }
.sw { position: relative; width: 40px; height: 24px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 12px; background: var(--panel-line); transition: background 150ms; pointer-events: none; }

.kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kinds button { border: 1px solid var(--panel-line); border-radius: 8px; padding: 8px 4px; font-size: 13px; line-height: 1.25; }

.kinds button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.add textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--panel-line); border-radius: 8px; padding: 8px 10px; font: 13px/1.4 var(--font-ui); background: transparent; color: inherit; }
.go { height: 40px; border-radius: 10px; background: var(--accent); color: var(--panel); font-weight: 600; }
.go:disabled { opacity: .5; cursor: default; }
.msg { font-size: 13px; color: var(--stage-sub); }
.msg.err { color: #C0392B; }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qitem { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.qitem img { width: 36px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--panel-line); }
.qitem .t { flex: 1; min-width: 0; }
.qitem .t small { display: block; color: var(--stage-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qitem button { color: var(--stage-sub); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.qitem button:disabled { opacity: .4; }

/* phone: a small pill opens the same controls as a sheet */
.pill { display: none; }
@media (max-width: 699px) {
  .pill { display: flex; position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; background: rgba(28,30,26,.82); color: #fff; font: 600 13px/1 var(--font-ui); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .pill[hidden] { display: none; }
  .sheet { position: absolute; inset: auto 0 0; z-index: 40; max-height: 82%; overflow-y: auto; background: var(--panel); color: var(--stage-fg); border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform 280ms cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  .sheet.open { transform: none; }
  .sheet .panel { border: 0; border-radius: 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

  .scrim.open { opacity: 1; pointer-events: auto; }
}
@media (min-width: 700px) { .sheet, .scrim { display: none; } }
@media (prefers-reduced-motion: reduce) { .slide, .sheet, .scrim, .sw span, .sw span::after { transition: none; } }
</style>

<script>
// Safe areas come from tools/river-fox/brand-pack.json (board "Safe areas"): refresh.cjs copies them into feed.json,
// so this page never holds a brand value of its own. Until the feed loads, no lines are drawn.
const SAFE_LABEL = { reel: "Reel safe area", story: "Story safe area" };

const S = { feed: null, queue: [], tab: "grid", opts: { next: true, safe: false, app: "auto", redo: "new" }, db: null, assets: null, pendingFile: null, pendingKind: null, story: null };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = (n) => (n == null ? "–" : n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "K" : n.toLocaleString("en-GB"));
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const ICON = {
  reel: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8 3l3 5.5M13.5 3l3 5.5"/><path d="M10 12v5l4.5-2.5Z" fill="currentColor" stroke="none"/></svg>',
  carousel: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h11a3 3 0 0 1 3 3v11a1 1 0 0 1-1 1V6a2 2 0 0 0-2-2H7a1 1 0 0 1 0-1Z"/><rect x="3" y="7" width="14" height="14" rx="3"/></svg>',
  heart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>',
  comment: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-3.4-6.8A8.4 8.4 0 0 1 20.5 12Zm0 0 .5 8.5-4-2"/></svg>',
  send: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 3 10 13.5M21 3l-6.5 18-4.5-7.5L2.5 9Z"/></svg>',
  save: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 21 12 16l-7 5V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1Z"/></svg>',
  dots: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  music: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18a3 3 0 1 1-2-2.8V5l12-2v12a3 3 0 1 1-2-2.8V7.3L9 8.7Z"/></svg>',
};

/* ---------- data ---------- */
function queueItem(d) {
  const kind = ["post", "reel", "story"].includes(d.kind) ? d.kind : "post";
  const url = d.asset ? "/_blob/" + d.asset : "";
  return { id: d._id, queued: true, kind, img: url, thumb: url, caption: String(d.caption || ""), order: Number(d.order) || 0, asset: d.asset || "", replaces: String(d.replaces || "") };
}
// A redo is a remade cover for a post that is already live: it shows in that post's place, tagged "Redo",
// and the "Redone covers" switch flips between the new and the original to compare.
function redoFor(id) { return S.queue.find((x) => x.replaces && x.replaces === id); }
function gridItems() {
  const live = (S.feed?.posts || []).filter((p) => p.kind !== "story").map((p) => {
    const r = S.opts.redo !== "original" ? redoFor(p.id) : null;
    return r ? { ...p, img: r.img, thumb: r.img, w: 0, h: 0, redo: true } : p;
  });
  const q = S.queue.filter((x) => x.kind !== "story" && !x.replaces).sort((a, b) => b.order - a.order);
  return [...q, ...live];
}
function storyItems() {
  const now = Date.now();
  const live = (S.feed?.posts || []).filter((p) => p.kind === "story" && now - Date.parse(p.date) < 24 * 3600e3).sort((a, b) => (a.date < b.date ? -1 : 1));
  const q = S.queue.filter((x) => x.kind === "story" && !x.replaces).sort((a, b) => a.order - b.order);
  return [...live, ...q];
}
function ago(iso) {
  if (!iso) return "";
  const h = (Date.now() - Date.parse(iso)) / 3600e3;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + "m";
  if (h < 24) return Math.round(h) + "h";
  const d = Math.round(h / 24);
  if (d < 7) return d + (d === 1 ? " day ago" : " days ago");
  return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long" });
}

/* ---------- profile ---------- */
function renderProfile() {
  const p = S.feed?.profile || {};
  $("#pUser").textContent = p.username || "riverfox_events";
  $("#pName").textContent = p.name || "";
  $("#pBio").textContent = (p.bio || []).join("\n");
  $("#pLink").textContent = p.link || "";
  const queuedGrid = S.queue.filter((x) => x.kind !== "story" && !x.replaces).length;
  $("#sPosts").textContent = p.posts != null ? fmt(p.posts + queuedGrid) : "–";
  $("#sFollowers").textContent = fmt(p.followers);
  $("#sFollowing").textContent = fmt(p.following);
  for (const img of [$("#pAvatarImg"), $("#navAvatar"), $("#storyAv"), ...document.querySelectorAll("#reelNav img")]) if (p.avatar) img.src = p.avatar;
  $("#pAvatar").classList.toggle("ringed", storyItems().length > 0);
  const hl = $("#pHighlights");
  hl.replaceChildren();
  for (const h of p.highlights || []) {
    const d = el("div", "hl"), c = el("div", "c"), i = el("img");
    i.src = h.img; i.alt = ""; i.loading = "lazy";
    c.append(i); d.append(c, el("div", "t", h.label)); hl.append(d);
  }
  renderGrid();
}

function renderGrid() {
  const g = $("#grid");
  g.replaceChildren();
  g.classList.toggle("reels", S.tab === "reels");
  const note = $("#feedNote");
  if (S.tab === "tagged") {
    const e = el("div", "empty"); e.append(el("b", "", "Photos and videos of you"), document.createTextNode("Tagged posts aren't copied into the preview."));
    g.append(e); g.style.display = "block"; note.hidden = true; return;
  }
  g.style.display = "";
  let items = gridItems();
  if (S.tab === "reels") items = items.filter((x) => x.kind === "reel");
  if (!S.feed) {
    for (let i = 0; i < 12; i++) g.append(el("div", "tile"));
    note.hidden = false; note.textContent = S.feedError || "Loading Laura's posts…";
    return;
  }
  items.forEach((it) => {
    const t = el("button", "tile"); t.type = "button";
    t.setAttribute("aria-label", (it.queued ? "Next " : "") + it.kind);
    const img = el("img"); img.src = it.thumb || it.img; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    t.append(img);
    if (it.kind === "reel" && S.tab !== "reels") { const b = el("span", "badge"); b.innerHTML = ICON.reel; t.append(b); }
    if (it.kind === "carousel") { const b = el("span", "badge"); b.innerHTML = ICON.carousel; t.append(b); }
    if (it.queued) t.append(el("span", "next", "Next"));
    if (it.redo) t.append(el("span", "next redo", "Redo"));
    t.addEventListener("click", () => (it.kind === "reel" ? openReels(it) : openFeed(it)));
    g.append(t);
  });
  note.hidden = false;
  note.textContent = S.feed.copiedAt ? `Posts copied from Instagram ${new Date(S.feed.copiedAt).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}` : "";
}

/* ---------- posts feed ---------- */
function postEl(it, avatar, user) {
  const a = el("article", "post"); a.dataset.id = it.id;
  const ph = el("div", "ph"); const av = el("img"); av.src = avatar; av.alt = "";
  const u = el("div", "u"); u.append(el("span", "", user));
  if (it.queued) u.append(el("span", "next", "Next"));
  if (it.redo) u.append(el("span", "next redo", "Redo"));
  const dots = el("span"); dots.innerHTML = ICON.dots;
  ph.append(av, u, dots);
  const m = el("div", "media");
  // Instagram shows a feed post at its own shape, between square-ish landscape and 3:4; Reels show as 4:5 in the feed.
  const ratio = it.kind === "reel" ? 4 / 5 : it.w && it.h ? Math.min(Math.max(it.w / it.h, 3 / 4), 1.91) : 3 / 4;
  m.style.aspectRatio = String(ratio);
  const img = el("img"); img.src = it.img; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
  if (!it.w && it.kind !== "reel") img.addEventListener("load", () => { m.style.aspectRatio = String(Math.min(Math.max(img.naturalWidth / img.naturalHeight, 3 / 4), 1.91)); }, { once: true });
  m.append(img);
  if (it.kind === "reel") { const b = el("span", "badge"); b.innerHTML = ICON.reel; m.append(b); m.style.cursor = "pointer"; m.addEventListener("click", () => openReels(it)); }
  if (it.kind === "carousel") { const b = el("span", "badge"); b.innerHTML = ICON.carousel; m.append(b); }
  const acts = el("div", "acts"); acts.innerHTML = ICON.heart + ICON.comment + ICON.send + '<span class="sp"></span>' + ICON.save;
  a.append(ph, m, acts);
  if (it.likes) a.append(el("div", "likes", `${fmt(it.likes)} ${it.likes === 1 ? "like" : "likes"}`));
  if (it.caption) {
    const c = el("div", "cap clamp"); const b = el("b", "", user + " "); c.append(b, document.createTextNode(it.caption));
    c.addEventListener("click", () => c.classList.remove("clamp"));
    a.append(c);
  }
  if (it.comments) a.append(el("div", "more", `View all ${it.comments} comments`));
  a.append(el("div", "meta", it.queued ? "Not posted yet" : ago(it.date)));
  return a;
}
function openFeed(start) {
  const p = S.feed?.profile || {};
  const box = $("#feedScroll"); box.replaceChildren();
  const items = gridItems();
  let target = null;
  for (const it of items) { const a = postEl(it, p.avatar || "", p.username || "riverfox_events"); box.append(a); if (start && it.id === start.id) target = a; }
  const v = $("#feed"); v.hidden = false;
  requestAnimationFrame(() => { box.scrollTop = target ? target.offsetTop : 0; requestAnimationFrame(() => v.classList.add("open")); });
  syncChrome();
}
function closeFeed() {
  const v = $("#feed"); v.classList.remove("open");
  const done = () => { v.hidden = true; syncChrome(); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) done(); else setTimeout(done, 290);
}

/* ---------- reels ---------- */
function safeBox(kind) {
  const box = el("div", "safe"); box.dataset.safe = kind; fillSafe(box); return box;
}
function fillSafe(box) {
  const sa = S.feed?.safe; const s = sa && sa[box.dataset.safe]; box.replaceChildren();
  if (!s) return;
  const i = el("i"), W = sa.frame.w, H = sa.frame.h;
  i.style.left = (s.x0 / W) * 100 + "%"; i.style.right = (1 - s.x1 / W) * 100 + "%";
  i.style.top = (s.y0 / H) * 100 + "%"; i.style.bottom = (1 - s.y1 / H) * 100 + "%";
  i.append(el("span", "", SAFE_LABEL[box.dataset.safe])); box.append(i);
}
function openReels(start) {
  const p = S.feed?.profile || {};
  const box = $("#reels"); box.replaceChildren();
  const items = gridItems().filter((x) => x.kind === "reel");
  let target = null;
  for (const it of items) {
    const r = el("div", "reel");
    const f = el("div", "frame"); const img = el("img"); img.src = it.img; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    f.append(img, el("div", "ui-grad"), safeBox("reel"));
    const side = el("div", "side");
    const stat = (svg, n) => { const d = el("div"); d.innerHTML = svg; if (n != null) d.append(el("div", "", fmt(n))); return d; };
    side.append(stat(ICON.heart, it.likes ?? (it.queued ? null : 0)), stat(ICON.comment, it.comments ?? (it.queued ? null : 0)), stat(ICON.send, null), stat(ICON.dots, null));
    const sq = el("div", "sq"); const si = el("img"); si.src = p.avatar || ""; si.alt = ""; sq.append(si); side.append(sq);
    const info = el("div", "info");
    const who = el("div", "who"); const av = el("img"); av.src = p.avatar || ""; av.alt = "";
    who.append(av, el("span", "", p.username || "riverfox_events"), el("span", "fb", "Follow"));
    info.append(who);
    if (it.caption) info.append(el("div", "rc", it.caption.split("\n")[0]));
    const au = el("div", "au"); au.innerHTML = ICON.music; au.append(el("span", "", (p.username || "riverfox_events") + " · Original audio")); info.append(au);
    f.append(side, info);
    r.append(f);
    if (it.queued || it.redo) { const q = el("div", "reel-q"); q.append(el("span", it.redo ? "next redo" : "next", it.redo ? "Redo" : "Next")); r.append(q); }
    box.append(r);
    if (start && it.id === start.id) target = r;
  }
  if (!items.length) box.append(el("div", "empty", "No Reels yet."));
  $("#reelView").hidden = false;
  requestAnimationFrame(() => { box.scrollTop = target ? target.offsetTop : 0; });
  syncChrome();
}
function closeReels() { $("#reelView").hidden = true; syncChrome(); }

/* ---------- stories ---------- */
let storyTimer = null;
function openStory() {
  const items = storyItems();
  if (!items.length) return;
  S.story = { items, i: 0 };
  const bars = $("#storyBars"); bars.replaceChildren();
  items.forEach(() => { const i = el("i"); i.append(el("b")); bars.append(i); });
  $("#storyView").hidden = false;
  showStory();
  syncChrome();
}
function showStory() {
  const { items, i } = S.story; const it = items[i];
  $("#storyImg").src = it.img;
  $("#storyAgo").textContent = it.queued ? "next" : ago(it.date);
  $("#storyQ").hidden = !it.queued;
  [...$("#storyBars").children].forEach((bar, j) => {
    const b = bar.firstChild; b.style.transition = "none"; b.style.width = j < i ? "100%" : "0";
  });
  clearTimeout(storyTimer);
  const cur = $("#storyBars").children[i].firstChild;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    cur.style.transition = reduce ? "none" : "width 6s linear"; cur.style.width = "100%";
  }));
  storyTimer = setTimeout(() => stepStory(1), 6000);
}
function stepStory(d) {
  if (!S.story) return;
  const n = S.story.i + d;
  if (n < 0) { S.story.i = 0; showStory(); return; }
  if (n >= S.story.items.length) { closeStory(); return; }
  S.story.i = n; showStory();
}
function closeStory() { clearTimeout(storyTimer); S.story = null; $("#storyView").hidden = true; syncChrome(); }

function syncChrome() {
  const darkOpen = !$("#reelView").hidden || !$("#storyView").hidden;
  $("#status").classList.toggle("on-dark", darkOpen);
  $("#pill").hidden = darkOpen;
}

/* ---------- controls ---------- */
function applyOpts() {
  const sc = $("#screen");
  sc.classList.toggle("hide-next", !S.opts.next);
  sc.classList.toggle("show-safe", S.opts.safe);
  const ph = $("#phone");
  if (S.opts.app === "auto") ph.removeAttribute("data-app"); else ph.dataset.app = S.opts.app;
  document.querySelectorAll("[data-opt=next]").forEach((x) => (x.checked = S.opts.next));
  document.querySelectorAll("[data-opt=safe]").forEach((x) => (x.checked = S.opts.safe));
  document.querySelectorAll("[data-appseg] button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.app === S.opts.app)));
  document.querySelectorAll("[data-redoseg] button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.redo === S.opts.redo)));
  store.set("rf-ig-opts", S.opts);
}

const panels = [];
function mountPanel(host) {
  const node = $("#panelTpl").content.firstElementChild.cloneNode(true);
  host.replaceChildren(node); panels.push(node);
  node.querySelector("[data-opt=next]").addEventListener("change", (e) => { S.opts.next = e.target.checked; applyOpts(); });
  node.querySelector("[data-opt=safe]").addEventListener("change", (e) => { S.opts.safe = e.target.checked; applyOpts(); });
  node.querySelectorAll("[data-appseg] button").forEach((b) => b.addEventListener("click", () => { S.opts.app = b.dataset.app; applyOpts(); }));
  node.querySelectorAll("[data-redoseg] button").forEach((b) => b.addEventListener("click", () => { S.opts.redo = b.dataset.redo; applyOpts(); renderGrid(); }));
  const file = node.querySelector("[data-file]");
  file.id = "file-" + panels.length;
  node.querySelector("[data-caption]").id = "caption-" + panels.length;
  file.addEventListener("change", () => pickFile(node, file.files[0]));
  node.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => { S.pendingKind = b.dataset.kind; syncAdd(); }));
  node.querySelector("[data-upload]").addEventListener("click", () => upload(node));
}
function syncAdd() {
  for (const n of panels) {
    const has = !!S.pendingFile;
    n.querySelector("[data-filename]").textContent = has ? S.pendingFile.name || "Picture chosen" : "Choose a picture";
    n.querySelector("[data-kinds]").hidden = !has;
    n.querySelector("[data-caption]").hidden = !has || S.pendingKind === "story";
    n.querySelector("[data-upload]").hidden = !has;
    n.querySelector("[data-upload]").disabled = !has || !S.pendingKind;
    n.querySelector("[data-upload]").textContent = S.pendingKind === "story" ? "Add as the next Story" : "Add to the grid";
    n.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.kind === S.pendingKind)));
  }
}
function addMsg(text, err) { for (const n of panels) { const m = n.querySelector("[data-addmsg]"); m.textContent = text; m.classList.toggle("err", !!err); } }

async function pickFile(node, f) {
  if (!f) return;
  S.pendingFile = f; S.pendingKind = null; addMsg("");
  try {
    const bmp = await createImageBitmap(f);
    const r = bmp.height / bmp.width;
    S.pendingKind = r > 1.6 ? "reel" : "post";
    bmp.close?.();
  } catch { S.pendingKind = null; }
  syncAdd();
}
async function toJpeg(f) {
  // Re-encode to a JPEG no wider than 1440px, so iPhone HEIC photos and huge originals both upload.
  const bmp = await createImageBitmap(f);
  const scale = Math.min(1, 1440 / bmp.width);
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", 0.9));
}
async function upload(node) {
  if (!S.pendingFile || !S.pendingKind) return;
  if (!S.assets || !S.db) { addMsg("Adding covers needs you signed in to claude.ai as the page's owner.", true); return; }
  const btn = node.querySelector("[data-upload]"); btn.disabled = true; addMsg("Uploading…");
  try {
    const blob = await toJpeg(S.pendingFile);
    const up = await S.assets.upload(blob, { type: "image/jpeg" });
    const caption = S.pendingKind === "story" ? "" : node.querySelector("[data-caption]").value.trim();
    await S.db.collection("queue").add({ kind: S.pendingKind, asset: up.id, caption, order: Date.now(), name: S.pendingFile.name || "" });
    S.pendingFile = null; S.pendingKind = null;
    panels.forEach((n) => { n.querySelector("[data-file]").value = ""; n.querySelector("[data-caption]").value = ""; });
    syncAdd(); addMsg("Added. It's top-left in the grid.");
    closeSheet();
  } catch (e) {
    const code = e && e.code;
    addMsg(code === "too_large" ? "That picture is too big. Try a smaller copy." : code === "not_granted" || code === "not_uploader" ? "Only the page's owner can add covers." : "The upload didn't go through. Try again.", true);
    btn.disabled = false;
  }
}
async function removeItem(it, btn) {
  if (!S.db) return;
  btn.disabled = true;
  try {
    await S.db.doc("queue/" + it.id).delete();
    if (it.asset && S.assets) S.assets.delete(it.asset).catch(() => {});
  } catch { btn.disabled = false; addMsg("Couldn't remove it. Try again.", true); }
}
function renderQueue() {
  for (const n of panels) {
    const box = n.querySelector("[data-queue]"); box.replaceChildren();
    const items = [...S.queue].sort((a, b) => a.order - b.order);
    if (!items.length) box.append(el("div", "msg", S.db ? "Nothing queued. Add a cover above, or Claude adds one when it makes a cover." : "Queued covers show once the page is open in claude.ai."));
    items.forEach((it, i) => {
      const r = el("div", "qitem"); const img = el("img"); img.src = it.thumb; img.alt = "";
      const t = el("div", "t");
      const kind = it.kind === "reel" ? "Reel" : it.kind === "story" ? "Story" : "Post";
      const orig = it.replaces && (S.feed?.posts || []).find((p) => p.id === it.replaces);
      t.append(document.createTextNode(it.replaces ? `Redo: ${kind.toLowerCase()} of ${orig ? new Date(orig.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "an older post"}` : `${i + 1}. ${kind}`));
      t.append(el("small", "", it.caption ? it.caption.split("\n")[0] : it.replaces ? "Shown in place of the original" : "No caption"));
      const b = el("button", "", "Remove"); b.type = "button"; b.addEventListener("click", () => removeItem(it, b));
      if (!S.db) b.hidden = true;
      r.append(img, t, b); box.append(r);
    });
    n.querySelector("[data-add]").hidden = !S.assets;
    n.querySelector("[data-redorow]").hidden = !S.queue.some((x) => x.replaces);
    const c = n.querySelector("[data-copied]");
    c.textContent = S.feed?.copiedAt ? `Laura's posts were copied from Instagram on ${new Date(S.feed.copiedAt).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}. Ask Claude to refresh the Instagram preview for newer ones.` : "";
  }
}

function openSheet() { $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); }
function closeSheet() { $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }

/* ---------- wiring ---------- */
function tick() { $("#clock").textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }
tick(); setInterval(tick, 15000);

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  renderGrid();
}));
$("#navbar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.nav === "reels") openReels(null);
  if (b.dataset.nav === "home") openFeed(null);
  if (b.dataset.nav === "me") $("#pScroll").scrollTo({ top: 0, behavior: "smooth" });
});
$("#pAvatar").addEventListener("click", openStory);
$("#feedBack").addEventListener("click", closeFeed);
$("#reelBack").addEventListener("click", closeReels);
$("#storyClose").addEventListener("click", (e) => { e.stopPropagation(); closeStory(); });
$("#storyPrev").addEventListener("click", () => stepStory(-1));
$("#storyNext").addEventListener("click", () => stepStory(1));
// Swipe down closes a Story, swipe right closes the Posts list (as on the phone).
(() => {
  let y0 = null, x0 = null;
  const sv = $("#storyView");
  sv.addEventListener("touchstart", (e) => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; }, { passive: true });
  sv.addEventListener("touchend", (e) => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0, dx = Math.abs(e.changedTouches[0].clientX - x0); if (dy > 80 && dx < 60) closeStory(); y0 = null; });
  const fv = $("#feed"); let fx = null, fy = null;
  fv.addEventListener("touchstart", (e) => { fx = e.touches[0].clientX; fy = e.touches[0].clientY; }, { passive: true });
  fv.addEventListener("touchend", (e) => { if (fx == null) return; const dx = e.changedTouches[0].clientX - fx, dy = Math.abs(e.changedTouches[0].clientY - fy); if (fx < 40 && dx > 80 && dy < 50) closeFeed(); fx = null; });
})();
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.story) closeStory(); else if (!$("#reelView").hidden) closeReels(); else if (!$("#feed").hidden) closeFeed(); else closeSheet(); }
  if (S.story && e.key === "ArrowRight") stepStory(1);
  if (S.story && e.key === "ArrowLeft") stepStory(-1);
});
$("#pill").addEventListener("click", openSheet);
$("#scrim").addEventListener("click", closeSheet);

$("#storySafe").replaceWith(safeBox("story"));
$("#reelNav").innerHTML = $("#navbar").innerHTML;
$("#reelNav").querySelectorAll("button").forEach((b) => { b.tabIndex = -1; b.disabled = true; });
mountPanel($("#panelHome"));
mountPanel($("#sheetBody"));
S.opts = { ...S.opts, ...(store.get("rf-ig-opts") || {}) };
applyOpts();
renderProfile();
renderQueue();

fetch("feed.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => { S.feed = d; document.querySelectorAll(".safe[data-safe]").forEach(fillSafe); renderProfile(); renderQueue(); })
  .catch(() => { S.feedError = "Laura's posts didn't load. Pull to reload, or ask Claude to refresh the Instagram preview."; renderGrid(); });

(async () => {
  const c = window.claude;
  if (!c || !c.use) { renderQueue(); return; }
  const [db, assets] = await Promise.all([c.use("db").catch(() => null), c.use("assets").catch(() => null)]);
  S.db = db; S.assets = assets;
  renderQueue();
  if (!db) return;
  const timer = setTimeout(() => { addMsg("Queued covers are taking a while to load.", true); }, 10000);
  db.collection("queue").orderBy("order", "asc").onSnapshot((snap) => {
    clearTimeout(timer);
    S.queue = snap.docs.map((d) => queueItem({ ...d.data(), _id: d.id }));
    renderProfile(); renderQueue();
  }, () => { clearTimeout(timer); addMsg("Queued covers couldn't load.", true); });
})();
</script>
